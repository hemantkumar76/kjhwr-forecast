version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auragrid-energy-terminal
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/elexon_cache.db
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
